<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobWatch</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --raised:#f1f3f6; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --accent-soft:#eef2ff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --radius:12px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0c0d10; --panel:#14161b; --raised:#1b1e25; --text:#e8eaef; --muted:#9097a3; --line:#262a33;
    --accent:#8b8cf8; --accent-soft:#23244a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  } }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=search], input[type=text], input[type=password], select {
    border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 10px; outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  .muted { color:var(--muted); } .small { font-size:12px; }

  /* login */
  #login { min-height:100vh; display:grid; place-items:center; }
  #login form { width:320px; display:grid; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:24px; }
  #login h2 { margin:0 0 4px; font-size:18px; }

  /* layout */
  .top { height:56px; display:flex; align-items:center; gap:16px; padding:0 20px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:5; }
  .brand { font-weight:700; font-size:16px; display:flex; gap:8px; align-items:center; }
  .brand i { width:10px; height:10px; border-radius:3px; background:var(--accent); display:inline-block; }
  .top .grow { flex:1; }
  .layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 56px); }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column;
    height:calc(100vh - 56px); position:sticky; top:56px; }
  aside .head { padding:16px 16px 8px; display:grid; gap:8px; }
  aside .head .row { display:flex; justify-content:space-between; align-items:center; }
  aside .list { overflow:auto; flex:1; padding:0 8px; }
  .co { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; cursor:pointer; }
  .co:hover { background:var(--raised); }
  .co input { accent-color:var(--accent); }
  .co .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.run { background:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .count { font-size:12px; color:var(--muted); min-width:24px; text-align:right; }
  aside .foot { padding:12px 16px; border-top:1px solid var(--line); }
  aside .foot button { width:100%; padding:10px; }
  main { padding:20px; min-width:0; }

  /* progress */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .prog-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .prog-head strong { font-size:15px; }
  .bar { height:8px; background:var(--raised); border-radius:99px; overflow:hidden; margin:12px 0; }
  .bar div { height:100%; background:var(--accent); width:0; transition:width .4s; }
  .stats { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:8px; }
  .stat b { font-size:20px; display:block; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { font-size:12px; padding:3px 10px; border-radius:99px; background:var(--accent-soft); color:var(--accent); border:1px solid transparent; }
  .chip.wait { background:transparent; border-color:var(--line); color:var(--muted); }
  .results { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px; margin-top:8px; }
  .res { display:flex; gap:8px; align-items:center; font-size:13px; padding:6px 8px; border-radius:8px; background:var(--raised); }
  .res .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }

  /* filters + jobs */
  .filters { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .filters label { display:flex; gap:6px; align-items:center; color:var(--muted); }
  .filters input[type=checkbox] { accent-color:var(--accent); }
  .jobs { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .job { display:grid; grid-template-columns:36px 1fr auto; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:center; }
  .job:last-child { border-bottom:0; }
  .job:hover { background:var(--raised); }
  .avatar { width:36px; height:36px; border-radius:8px; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; font-weight:700; }
  .job .title { font-weight:600; color:var(--text); text-decoration:none; }
  .job .title:hover { color:var(--accent); }
  .meta { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:2px; }
  .badge { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.new { border-color:var(--accent); color:var(--accent); }
  .badge.exp { color:var(--text); }
  .badge.st-interested { border-color:var(--warn); color:var(--warn); }
  .badge.st-applied { border-color:var(--ok); color:var(--ok); }
  .actions { display:flex; gap:6px; }
  .actions button { padding:4px 10px; font-size:12px; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .pager { display:flex; gap:8px; justify-content:space-between; align-items:center; margin:12px 0; }
  @media (max-width: 860px) {
    .layout { grid-template-columns:1fr; }
    aside { position:static; height:auto; max-height:50vh; border-right:0; border-bottom:1px solid var(--line); }
    .job { grid-template-columns:1fr; } .avatar { display:none; }
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h2>Sign in to JobWatch</h2>
    <input id="u" type="text" placeholder="Username" value="admin" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary">Sign in</button>
    <span id="loginErr" class="small" style="color:var(--bad)"></span>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="brand"><i></i>JobWatch</div>
    <input id="q" type="search" placeholder="Search roles, companies, skills…" style="width:min(420px,40vw)">
    <span class="grow"></span>
    <span id="topStatus" class="small muted"></span>
    <button id="logout">Sign out</button>
  </div>
  <div class="layout">
    <aside>
      <div class="head">
        <div class="row"><strong>Companies</strong><span id="selCount" class="small muted"></span></div>
        <input id="coFilter" type="search" placeholder="Filter companies…">
        <div class="row small">
          <span><button id="selAll" class="small">Select all</button> <button id="selNone" class="small">Clear</button></span>
          <span class="muted">jobs</span>
        </div>
      </div>
      <div id="coList" class="list"></div>
      <div class="foot"><button id="fetch" class="primary">Fetch selected</button></div>
    </aside>

    <main>
      <div id="progress" class="card" hidden>
        <div class="prog-head">
          <strong id="progTitle">Fetching…</strong>
          <span id="progTime" class="small muted"></span>
        </div>
        <div class="bar"><div id="progBar"></div></div>
        <div class="stats">
          <div class="stat"><b id="stDone">0</b><span class="small muted">sites done</span></div>
          <div class="stat"><b id="stIndia">0</b><span class="small muted">India jobs seen</span></div>
          <div class="stat"><b id="stNew">0</b><span class="small muted">new jobs</span></div>
          <div class="stat"><b id="stFail">0</b><span class="small muted">failed</span></div>
        </div>
        <div id="nowWrap"><span class="small muted">Scraping now</span><div id="now" class="chips"></div></div>
        <details id="waitWrap"><summary id="waitSummary">Waiting</summary><div id="wait" class="chips"></div></details>
        <details open><summary>Completed</summary><div id="results" class="results"></div></details>
      </div>

      <div class="filters">
        <label><input type="checkbox" id="fresher" checked> Freshers (0–1 yrs)</label>
        <label><input type="checkbox" id="unknownExp" checked> include “experience not stated”</label>
        <label><input type="checkbox" id="onlySel"> only selected companies</label>
        <select id="status">
          <option value="">Active (all but Not interested)</option><option value="new">New</option>
          <option value="interested">Interested</option><option value="applied">Applied</option>
          <option value="not_interested">Not interested</option>
        </select>
        <span id="count" class="small muted"></span>
      </div>
      <div id="jobs" class="jobs"></div>
      <div class="pager"><button id="prev">← Previous</button><span id="pageInfo" class="small muted"></span><button id="next">Next →</button></div>
    </main>
  </div>
</div>

<script>
const API = "/api/v1", H = {"Content-Type": "application/json", "X-JobWatch-Client": "web"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEL_KEY = "jobwatch.selected";
let companies = [], selected = new Set(), page = 1, lastRunning = false, pollTimer = null;
const pageSize = 50;

async function api(path, opts = {}) {
  const r = await fetch(API + path, {credentials: "same-origin", headers: H, ...opts});
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || r.statusText);
  return r.status === 204 ? null : r.json();
}
function showLogin() { $("app").hidden = true; $("login").hidden = false; }
function showApp() { $("login").hidden = true; $("app").hidden = false; init(); }

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch(API + "/auth/login", {method: "POST", headers: H, credentials: "same-origin",
    body: JSON.stringify({username: $("u").value, password: $("p").value})});
  if (r.ok) showApp(); else $("loginErr").textContent = "Invalid username or password";
};
$("logout").onclick = async () => { await api("/auth/logout", {method: "POST"}).catch(() => {}); showLogin(); };

/* ---------- companies ---------- */
function saveSel() { try { localStorage.setItem(SEL_KEY, JSON.stringify([...selected])); } catch {} }
async function loadCompanies() {
  companies = await api("/fetch/companies");
  let saved = null; try { saved = JSON.parse(localStorage.getItem(SEL_KEY)); } catch {}
  selected = new Set((saved || companies.map(c => c.id)).filter(id => companies.some(c => c.id === id)));
  renderCompanies();
}
function renderCompanies(status) {
  const f = $("coFilter").value.trim().toLowerCase();
  const running = new Set(status?.current || []), done = {};
  (status?.sites || []).forEach(s => done[s.company] = s.status);
  $("coList").innerHTML = companies.filter(c => !f || c.name.toLowerCase().includes(f)).map(c => {
    const isRun = [...running].some(l => l === c.name || l.startsWith(c.name + " ·"));
    const st = done[c.name] || (c.last_error ? "failed" : c.last_success_at ? "succeeded" : "");
    const dot = isRun ? "run" : st === "succeeded" ? "ok" : st === "failed" ? "bad" : "";
    const tip = c.last_success_at ? `Last fetched ${new Date(c.last_success_at).toLocaleString()}` : "Not fetched yet";
    return `<label class="co" title="${esc(tip)} · ${esc(c.platform)}">
      <input type="checkbox" data-id="${c.id}" ${selected.has(c.id) ? "checked" : ""}>
      <span class="dot ${dot}"></span><span class="name">${esc(c.name)}</span><span class="count">${c.jobs || ""}</span></label>`;
  }).join("");
  $("selCount").textContent = `${selected.size} of ${companies.length} selected`;
  $("fetch").textContent = `Fetch ${selected.size === companies.length ? "all" : selected.size} ${selected.size === 1 ? "company" : "companies"}`;
  $("fetch").disabled = !selected.size || lastRunning;
}
$("coList").onchange = e => {
  const id = Number(e.target.dataset.id); if (!id) return;
  e.target.checked ? selected.add(id) : selected.delete(id); saveSel(); renderCompanies();
  if ($("onlySel").checked) { page = 1; loadJobs(); }
};
$("coFilter").oninput = () => renderCompanies();
$("selAll").onclick = () => { companies.forEach(c => selected.add(c.id)); saveSel(); renderCompanies(); };
$("selNone").onclick = () => { selected.clear(); saveSel(); renderCompanies(); };

/* ---------- fetch progress ---------- */
$("fetch").onclick = async () => {
  try {
    const ids = selected.size === companies.length ? null : [...selected];
    await api("/fetch-all", {method: "POST", body: JSON.stringify({company_ids: ids})});
    poll();
  } catch (e) { alert(e.message); }
};
function fmtDur(ms) { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; }
async function poll() {
  clearTimeout(pollTimer);
  const s = await api("/fetch-all");
  lastRunning = s.running;
  if (!s.started_at) { $("progress").hidden = true; renderCompanies(s); return; }
  $("progress").hidden = false;
  const failed = s.sites.filter(x => x.status === "failed").length;
  $("progTitle").textContent = s.running ? `Fetching ${s.done} of ${s.total} sites…` : `Last fetch: ${s.done} of ${s.total} sites`;
  const end = s.finished_at ? new Date(s.finished_at) : new Date();
  $("progTime").textContent = `${s.running ? "running" : "finished"} · ${fmtDur(end - new Date(s.started_at))}`;
  $("progBar").style.width = `${s.total ? (100 * s.done / s.total) : 0}%`;
  $("stDone").textContent = `${s.done}/${s.total}`; $("stIndia").textContent = s.india_jobs;
  $("stNew").textContent = s.new_jobs; $("stFail").textContent = failed;
  $("nowWrap").hidden = !s.current.length;
  $("now").innerHTML = s.current.map(l => `<span class="chip">${esc(l)}</span>`).join("");
  $("waitWrap").hidden = !s.pending.length;
  $("waitSummary").textContent = `Waiting (${s.pending.length})`;
  $("wait").innerHTML = s.pending.map(l => `<span class="chip wait">${esc(l)}</span>`).join("");
  const icon = st => st === "succeeded" ? `<span class="dot ok"></span>` : st === "failed" ? `<span class="dot bad"></span>` : `<span class="dot" style="background:var(--warn)"></span>`;
  $("results").innerHTML = s.sites.map(x => `<div class="res" title="${esc(x.error || x.status)}">${icon(x.status)}
    <span class="name">${esc(x.site)}</span><span class="small muted">${x.status === "failed" ? "failed" : `${x.in_scope} · +${x.new}`}</span></div>`).join("");
  $("topStatus").textContent = s.running ? `Fetching ${s.done}/${s.total}…` : "";
  renderCompanies(s);
  if (s.running) { pollTimer = setTimeout(poll, 2000); loadJobs(); }
  else { loadCompanies(); loadJobs(); }
}

/* ---------- jobs ---------- */
function exp(j) {
  if (j.experience_min_years == null) return "";
  const a = Number(j.experience_min_years), b = j.experience_max_years != null ? Number(j.experience_max_years) : null;
  return `<span class="badge exp">${b != null && b !== a ? `${a}–${b} yrs` : `${a}+ yrs`}</span>`;
}
async function loadJobs() {
  const p = new URLSearchParams({page, page_size: pageSize, sort: "discovered_desc"});
  const q = $("q").value.trim();
  if (q) { p.set("q", q); p.set("sort", "relevance"); }
  if ($("fresher").checked) { p.set("max_experience_years", "1"); p.set("include_unknown_experience", $("unknownExp").checked); }
  if ($("status").value) p.set("status", $("status").value);
  else ["inbox", "considering", "applied", "in_process", "offer"].forEach(c => p.append("status_category", c));
  if ($("onlySel").checked) { if (!selected.size) { renderJobs({items: [], total: 0, page: 1}); return; } selected.forEach(id => p.append("company_id", id)); }
  renderJobs(await api("/jobs?" + p));
}
function renderJobs(data) {
  const pages = Math.max(1, Math.ceil(data.total / pageSize));
  $("count").textContent = `${data.total} job${data.total === 1 ? "" : "s"}`;
  $("pageInfo").textContent = `Page ${data.page} of ${pages}`;
  $("prev").disabled = page <= 1; $("next").disabled = page >= pages;
  $("jobs").innerHTML = data.items.map(j => `
    <div class="job" data-id="${j.id}">
      <div class="avatar">${esc(j.company.name[0] || "?")}</div>
      <div>
        <a class="title" href="${esc(j.apply_url || "#")}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <div class="meta">
          <span>${esc(j.company.name)}</span><span>${esc(j.location_text || "")}</span>
          ${exp(j)}${j.is_new ? '<span class="badge new">new</span>' : ""}
          <span class="badge st-${esc(j.status.key)}">${esc(j.status.label)}</span>
          <span>found ${new Date(j.first_seen_at).toLocaleDateString()}</span>
        </div>
      </div>
      <div class="actions">
        <button data-s="interested">★ Interested</button>
        <button data-s="applied">✓ Applied</button>
        <button data-s="not_interested" title="Not interested">✕</button>
      </div>
    </div>`).join("") || `<div class="empty">No matching jobs yet. Select companies on the left and click “Fetch”.</div>`;
}
$("jobs").onclick = async e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  await api(`/jobs/${b.closest(".job").dataset.id}/status`, {method: "PUT", body: JSON.stringify({status: b.dataset.s})});
  loadJobs();
};
let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(() => { page = 1; loadJobs(); }, 300); };
["fresher", "unknownExp", "status", "onlySel"].forEach(id => $(id).onchange = () => { page = 1; loadJobs(); });
$("prev").onclick = () => { page--; loadJobs(); }; $("next").onclick = () => { page++; loadJobs(); };

async function init() { await loadCompanies(); await poll(); }
api("/auth/me").then(showApp).catch(() => {});
</script>
</body>
</html>
