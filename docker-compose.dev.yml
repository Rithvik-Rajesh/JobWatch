# Local development & integration-test database. No cloud resources.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobwatch
      POSTGRES_PASSWORD: jobwatch
      POSTGRES_DB: jobwatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobwatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobwatch"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  jobwatch_pg:
